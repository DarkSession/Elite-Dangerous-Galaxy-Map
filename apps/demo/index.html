<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Elite Dangerous Galaxy Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }

      #map {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      #labels {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        pointer-events: none;
      }

      #message {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 16px;
        background: #1a0000;
        color: #ffb0b0;
        font-size: 14px;
        line-height: 1.5;
      }

      #message[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="labels"></div>
    <div id="message" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
