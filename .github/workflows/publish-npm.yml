# Publishes `@elite-dangerous-almanac/galaxy-map` to the npm registry.
#
# **A person starts this run, and nothing else does.** The only trigger is
# `workflow_dispatch`: no push, no tag and no merge publishes. The reason is the browser
# suite. It reads the renderer string through `WEBGL_debug_renderer_info` and fails a run
# that falls back to SwiftShader or llvmpipe, and a GitHub-hosted runner carries no GPU,
# so this workflow cannot run it — as `ci.yml` cannot. The maintainer runs
# `pnpm test:e2e` in the dev container before the dispatch. That is the gate on the
# rendering, and this workflow does not weaken it or stand in for it.
#
# The run is in three jobs. `prepare` chooses the version, runs every check, builds and
# packs, and reports the tarball's SHA-256. `publish` downloads that tarball, checks the
# digest, and publishes with OIDC and provenance — it is the only job with
# `id-token: write`, and it runs no project code. `release` tags the commit and writes
# the GitHub release, after the publish and not before: a tag that names a version the
# registry refused has to be removed by hand.
#
# Every action is pinned to a commit SHA, with the version in the comment beside it, for
# the reason `ci.yml` states. The two npm clients are pinned as well; the steps that pin
# them say why.
#
# **Three things live outside this repository, and no step here can create them**: the
# npm Trusted Publisher for this package, pointing at this repository and this file; the
# `npm` GitHub environment the publish job names; and the package's place in the
# `@elite-dangerous-almanac` organisation. `README.md` records all three.
name: Publish npm Package

on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false # a publish that is already running must finish

permissions:
  contents: read

jobs:
  prepare:
    name: Check and pack the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball-sha256: ${{ steps.pack.outputs.tarball-sha256 }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::a release runs from the default branch ($DEFAULT_BRANCH), not $RELEASE_REF"
            exit 1
          fi

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The pack runs on a pinned npm 11 client and not on whichever npm release ships
      # with Node 22. The tarball is what gets published, so the tool that writes it is
      # pinned as every action is.
      - name: Install the packing npm client
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = 11.19.0

      # The action reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The install runs at the workspace root and installs every package in one pass.
      # `--frozen-lockfile` fails rather than writes pnpm-lock.yaml, so a run cannot step
      # around the 7-day release hold in pnpm-workspace.yaml.
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve what to publish
        id: package
        working-directory: packages/galaxy-map
        run: |
          set -euo pipefail

          name=$(node -p 'require("./package.json").name')
          manifest_version=$(node -p 'require("./package.json").version')

          # A name the registry does not know is no published version, and not an error.
          # Any other failure is an error: a registry that cannot be asked is not the
          # same answer as a line with no release.
          if ! published=$(npm view --json "$name" versions 2>&1); then
            case "$published" in
              *'"E404"'*) published='[]' ;;
              *)
                echo "::error::could not ask the registry for $name versions: $published"
                exit 1
                ;;
            esac
          fi

          # The rule is in the script and not in this block, so a unit test reads it.
          # `tests/next-version.test.ts` runs the five cases.
          version=$(node ../../scripts/next-version.mjs "$manifest_version" "$published")

          # The manifest is **not** stamped here. `pnpm test` reads the committed
          # version and asserts it, so a stamp before the checks would fail the run it
          # is part of. The pack step stamps, and the reading of the packed
          # `package.json` under it is what proves the stamp took.
          {
            echo "name=$name"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

          echo "$name@$version -> dist-tag latest" >>"$GITHUB_STEP_SUMMARY"

      - name: Check the version is still unpublished
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          # An npm version is permanent, so a repeat publish fails after the whole build
          # rather than at the start. Public package metadata needs no credential. Only
          # npm's own "no such package or version" reads as free.
          #
          # `--json` puts everything needed on stdout, so stderr is dropped rather than
          # merged: a warning npm happens to print must not read as a version.
          if answer=$(npm view --json "$SPEC" version 2>/dev/null); then
            if [ -n "$answer" ] && [ "$answer" != null ]; then
              echo "::error::$SPEC is already on the registry — run the workflow again to take the next patch"
              exit 1
            fi
          else
            case "$answer" in
              *'"E404"'*) : ;; # the answer for a version that is still free
              *)
                echo "::error::could not ask the registry about $SPEC: $answer"
                exit 1
                ;;
            esac
          fi

      - name: Check the release tag is unused
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::could not check whether v$VERSION exists"
              exit "$status"
            fi
          fi

      # The checks, in the order a developer runs them, and the order `ci.yml` runs them
      # in. The audit is the one step `ci.yml` does not hold: a release is where a known
      # advisory in a shipped dependency matters.
      - name: Lint
        run: pnpm lint

      - name: Check the types
        run: pnpm exec tsc --noEmit

      - name: Run the unit tests
        run: pnpm test

      # `pnpm run audit` and not `pnpm audit`: the level lives in the root script, so the
      # workflow and a developer read the same one.
      - name: Audit the dependencies
        run: pnpm run audit

      # This job holds no `id-token` permission. ESLint, tsc, Vitest and Vite all run the
      # installed dependency tree, and none of it can ask for the identity npm trusts.
      - name: Build the library
        run: pnpm build

      - name: Check the packed tarball
        run: pnpm test:package

      - name: Pack for publishing
        id: pack
        working-directory: packages/galaxy-map
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          # npm is the release ledger. The manifest chooses the major.minor line, and
          # every version already published on that line moves the patch on. The stamp
          # is here, after the checks, and it is never committed.
          npm version "$EXPECTED_VERSION" \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts >/dev/null

          # `--ignore-scripts` is off here on purpose: `prepack` copies the licence into
          # the package, and the tarball must carry it.
          tarball=$(npm pack)
          if [ ! -f "$tarball" ]; then
            echo "::error::npm pack wrote no $tarball"
            exit 1
          fi

          {
            echo "tarball=$tarball"
            echo "tarball-sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          } >>"$GITHUB_OUTPUT"

          packed_version=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "$packed_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::the packed package.json holds $packed_version and not $EXPECTED_VERSION"
            exit 1
          fi

      - name: Upload the package for the OIDC job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: packages/galaxy-map/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm with OIDC
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm
      url: https://www.npmjs.com/package/@elite-dangerous-almanac/galaxy-map
    permissions:
      contents: read
      id-token: write # lets npm trade GitHub's OIDC identity for publish access
    steps:
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # This exact Node release carries npm 11.17.0, which supports Trusted
          # Publishing. Naming the release installs no new code in the job that holds
          # the OIDC permission.
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Download the packed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package

      - name: Verify the Trusted Publishing client
        run: test "$(npm --version)" = 11.17.0

      - name: Verify the package digest
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail

          case "$TARBALL" in
            *.tgz) ;;
            *)
              echo "::error::unexpected package filename: $TARBALL"
              exit 1
              ;;
          esac
          if [[ "$TARBALL" = */* || "$TARBALL" = .* || "$TARBALL" = -* ]]; then
            echo "::error::the package filename must be a plain name: $TARBALL"
            exit 1
          fi
          if ! [[ "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the package digest is not a SHA-256 value"
            exit 1
          fi

          echo "$TARBALL_SHA256  $TARBALL" | sha256sum --check --strict

      - name: Publish
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
        # `npm` and not `pnpm`, on purpose: npm trades the job's OIDC identity for
        # short-lived publish access and attaches the provenance attestation. The
        # package was built in the job above, which holds no such permission; this job
        # checks its digest and uploads it.
        #
        # `--access public` because a scoped package defaults to restricted, and
        # `publishConfig` inside the tarball cannot set the registry the CLI uses.
        # `--provenance` makes a missing attestation fatal rather than leaving it to
        # npm's own detection. `--ignore-scripts` keeps a lifecycle script in the
        # tarball from running beside the OIDC permission.
        run: >-
          npm publish "./$TARBALL"
          --registry=https://registry.npmjs.org
          --access public
          --tag latest
          --provenance
          --ignore-scripts

  release:
    name: Create the git tag and the GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if ! tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha 2>/dev/null); then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/v$VERSION" \
              -f sha="$GITHUB_SHA" >/dev/null
            tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha)
          fi

          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION points at $tag_sha and not $GITHUB_SHA"
            exit 1
          fi

          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --verify-tag \
              --title "v$VERSION" \
              --generate-notes
          fi
