<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Elite Dangerous Galaxy Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }

      #map {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      #labels {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        pointer-events: none;
      }

      .region-label {
        position: absolute;
        white-space: nowrap;
        padding: 2px 6px;
        color: #cfe4ff;
        font-size: 13px;
        line-height: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        /* The plate is what holds the 3 to 1 bound over the bright core. The glow
           now sits on the plate, so it keeps the 2px reading that sharpens the
           glyph edge and drops the 6px one that was tuned for dark ground. */
        background: rgba(0, 0, 0, 0.45);
        border-radius: 3px;
        text-shadow: 0 0 2px #000;
        pointer-events: none;
      }

      #message {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 16px;
        background: #1a0000;
        color: #ffb0b0;
        font-size: 14px;
        line-height: 1.5;
      }

      #message[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="labels"></div>
    <div id="message" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
